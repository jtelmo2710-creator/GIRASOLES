<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Un ramo de girasoles para ti</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <main class="card">
    <div class="start-overlay" id="startOverlay">
      <button class="start-btn" id="startBtn" type="button" disabled>
        <img src="assets/img/girasol.png" alt="" class="start-btn__img">
        <span class="start-btn__label" id="startLabel">Cargando…</span>
      </button>
    </div>

    <header class="message" id="message">
      <h1 id="title"></h1>
      <p id="text"></p>
    </header>

    <!-- El ramo se construye desde assets/js/script.js -->
    <div class="bouquet" id="bouquet" role="img" aria-label="Un ramo de girasoles que va creciendo"></div>

    <button class="replay" id="replay" type="button" aria-label="Ver de nuevo" title="Ver de nuevo">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 12a8 8 0 1 1-2.6-5.9"/>
        <path d="M20 4v5h-5"/>
      </svg>
    </button>

    <button class="sound-toggle is-muted" id="soundToggle" type="button" aria-label="Silenciar música" title="Música">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4z"/>
        <path class="wave" d="M16.3 8.5a5 5 0 0 1 0 7"/>
        <path class="wave" d="M18.8 6a8.5 8.5 0 0 1 0 12"/>
        <path class="mute-x" d="M4.5 4.5l15 15"/>
      </svg>
    </button>

    <audio id="cancion" preload="auto"></audio>
  </main>

  <script src="assets/js/script.js"></script>
</body>
</html>
